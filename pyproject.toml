[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo"
version = "0.1.0"
description = "A full-featured modeless CLI code editor built on Textual"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70",
    "pygments>=2.15",
    "lsprotocol>=2023.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[project.scripts]
demo = "demo.cli:main"

[tool.setuptools.packages.find]
include = ["demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
